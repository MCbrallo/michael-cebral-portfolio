<article class="wp-block-group is-layout-flow wp-block-group-is-layout-flow">
<div class="wp-block-group fb-article-head has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<div class="wp-block-group is-layout-flow wp-block-group-is-layout-flow"><h1 class="wp-block-post-title">Sixteen deep-tech companies join laboratories to build accelerator prototypes</h1>
<div class="wp-block-post-excerpt"><p class="wp-block-post-excerpt__excerpt">More than a third of the partners in EPITA are companies, and one of them leads a work package. The coordinator does not think a project of this size coordinated by CERN has had so much industry before. </p></div>
<div class="wp-block-group fb-meta is-layout-flex wp-block-group-is-layout-flex"><div class="taxonomy-category wp-block-post-terms"><a href="#category-industry" rel="tag">Industry</a></div>
<div class="wp-block-post-author-name">Michael Cebral</div>
<div class="wp-block-post-date"><time datetime="2026-11-12T09:00:00+01:00">12 November 2026</time></div>
<p class="wp-block-paragraph">5 min read</p>
</div>
</div>
</div>
<div class="wp-block-group fb-article-figure has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<div class="wp-block-group alignwide is-layout-flow wp-block-group-is-layout-flow"><figure class="is-wide wp-block-post-featured-image"><img alt="Two people in helmets and face masks work on a large round steel magnet. One crouches at its base and handles cables, and the other stands on a platform behind it" class="attachment-post-thumbnail size-post-thumbnail wp-post-image" decoding="async" fetchpriority="high" height="1280" loading="eager" sizes="(max-width: 1280px) 100vw, 1200px" src="/newsroom/uploads/iss-magnet.jpg" srcset="/newsroom/uploads/iss-magnet.jpg 1920w, /newsroom/uploads/iss-magnet-300x200.jpg 300w, /newsroom/uploads/iss-magnet-1024x683.jpg 1024w, /newsroom/uploads/iss-magnet-768x512.jpg 768w, /newsroom/uploads/iss-magnet-1536x1024.jpg 1536w" style="object-fit:cover;" width="1920"/></figure>
<p class="fb-credit wp-block-paragraph">Work on the magnet of the ISOLDE Solenoidal Spectrometer at CERN. Photograph by Julien Marius Ordan for CERN, CC BY 4.0.</p>
</div>
</div>
<div class="entry-content wp-block-post-content has-global-padding is-layout-constrained wp-block-post-content-is-layout-constrained">
<p class="wp-block-paragraph">Sixteen of the 42 partners in EPITA are deep-tech companies, according to the project website. That is more than a third of a consortium that CERN coordinates and that aims to build 22 prototypes of accelerator technology by 2030. Toms Torims, the coordinator, gave a slightly higher figure in an interview published in March 2026. He counted 17 industry partners, around 40% of the consortium, and said he did not think this had ever been the case before for a project of this size coordinated by CERN.</p>
<p class="wp-block-paragraph">In the same interview he described them as European high-tech companies that work in areas such as electronics, materials and additive manufacturing, which most people know as industrial 3D printing. Some are medium-sized and some are very small.</p>
<h2 class="wp-block-heading">Who they are</h2>
<p class="wp-block-paragraph">The project website does not say which of its partners are companies. The project’s record in CORDIS, the database of the European Commission, does mark the private for-profit ones, and the Structure page of the website shows the work packages in which each partner takes part. Putting the two together gives this list.</p>
<figure class="has-index wp-block-table fb-table"><table aria-label="Who they are"><thead><tr><th scope="col">No.</th><th scope="col">Work package</th><th scope="col">Companies</th></tr></thead><tbody><tr><td>3</td><td>Co-creation with industry</td><td>Kyma (Italy), in the task on the industry forum</td></tr><tr><td>4</td><td>Superconducting thin films for radiofrequency cavities</td><td>RI Research Instruments (Germany)</td></tr><tr><td>5</td><td>Laser-driven acceleration</td><td>Optoman (Lithuania), Instrumentation Technologies (Slovenia) and SenSic (Switzerland)</td></tr><tr><td>6</td><td>Advanced radiofrequency technologies</td><td>Vitave Tech (Czechia)</td></tr><tr><td>7</td><td>Permanent magnets</td><td>Kyma (Italy), which leads it, and ProactiveRD (Spain)</td></tr><tr><td>8</td><td>High-temperature superconducting magnets</td><td>Arquimea (Spain) and Subra (Denmark)</td></tr><tr><td>9</td><td>High-brightness electron injectors</td><td>COMEB (Italy) and VDL ETG (Netherlands)</td></tr><tr><td>11</td><td>Additive manufacturing</td><td>Rösler Italiana (Italy) and Safina (Czechia)</td></tr><tr><td>12</td><td>Advanced materials for accelerators</td><td>Nanoker (Spain) and RHP Technology (Austria)</td></tr></tbody></table></figure>
<p class="wp-block-paragraph">That makes 15 companies in ten countries, with Kyma in two work packages. The Structure page also names Zanon in the work packages on thin films and on surface treatments for niobium cavities, and the page of work package 4 says that Zanon will build a new industrial coating facility. The list of participants in CORDIS does not name it, so the table leaves it out.</p>
<h2 class="wp-block-heading">Inside the technical work</h2>
<p class="wp-block-paragraph">Torims explained in the interview that each work package has an industry partner that supports the development of the prototypes, and that companies will manage some of the deliverables. He gave one example, a new production line that will be a direct result of the project.</p>
<p class="wp-block-paragraph">The Structure page bears him out for the technical work. It names at least one partner from industry in each of the nine technical work packages, numbers 4 to 12. In work package 10, on surface treatments, that partner is Zanon. Of the three work packages that organise the project, only number 3 lists a company. Numbers 1 and 2, on management and communication, list none.</p>
<p class="wp-block-paragraph">One work package goes further and is led by a company. Raffaella Geometrante, managing director of Kyma, leads the work on permanent magnets, where <a href="#permanent-magnets-work-package">a tunable magnet is meant to become a product</a>.</p>
<h2 class="wp-block-heading">Work package 3 links research and industry</h2>
<p class="wp-block-paragraph">One of the twelve work packages deals only with the link between research and industry. Its official title is Reinforcing Co-Creation with Industry, and Carsten Welsch of the University of Liverpool leads it.</p>
<figure class="wp-block-pullquote has-open-quote"><blockquote><p>“Our work package bridges accelerator research and industry, ensuring that promising technologies are identified early, transferred effectively, and developed into solutions with real economic and societal impact.”</p><cite>Carsten Welsch, University of Liverpool, leader of work package 3, on the project website</cite></blockquote></figure>
<p class="wp-block-paragraph">It has four tasks. The first helps researchers to take their results to the market. The University of Liverpool designs training on market validation, business models, intellectual property and early-stage funding, and pairs the participants with experienced entrepreneurs as mentors.</p>
<p class="wp-block-paragraph">The second task is about the Accelerator Science and Technology Industry Permanent Forum, known as AIPF. Torims said that it was established in 2023 to connect industry with research institutions and that EPITA now gives it funding. The task aims to consolidate it as a permanent platform. CERN coordinates it, and the work includes two white papers, one on how to share the risk of building prototypes at an early stage and one on how industry and research institutions work together. Three workshops with experts are also planned, and technical staff at Kyma will support the forum.</p>
<p class="wp-block-paragraph">The third task will draw a roadmap for the medical and social uses of accelerators from what clinicians, medical physicists and companies say they need. The fourth looks further ahead and studies new accelerator concepts. The other eleven work packages and their leaders are in <a href="#who-leads-the-twelve-work-packages">the article on the structure of the project</a>.</p>
<h2 class="wp-block-heading">The stated aim is European competitiveness</h2>
<p class="wp-block-paragraph">At the launch in May, Torims said that the purpose of EPITA is “to maintain Europe’s technological leadership and competitiveness in accelerator science”. He also presented the work with industry as a way to secure Europe’s technological sovereignty.</p>
<div class="wp-block-group is-style-note is-layout-flow wp-block-group-is-layout-flow">
<p class="fb-eyebrow wp-block-paragraph">About the count</p>
<p class="wp-block-paragraph">The sources give three different numbers of companies. The project website says 16 deep-tech companies and the article about the launch 16 deep-tech partners. In the March interview Torims spoke of 17 industry partners, around 40% of the consortium. The CORDIS record marks 15 participants as private for-profit entities, by my count on 12 November 2026.</p>
<p class="wp-block-paragraph">I have used 16 in the headline because it is the figure that the project itself gives. The countries in the table come from CORDIS and the work packages from the Structure page of the project website. I have shortened some company names, and CORDIS lists Optoman under its registered name, UAB Optomenas.</p>
</div>
