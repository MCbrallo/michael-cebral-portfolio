<div class="wp-block-group fb-hero__content has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<div class="wp-block-group alignwide fb-hero__text is-layout-flow wp-block-group-is-layout-flow"><h1 class="wp-block-post-title">EPITA aims to build 22 working prototypes of accelerator technology by 2030</h1>
<div class="wp-block-post-excerpt"><p class="wp-block-post-excerpt__excerpt">The European project started in May 2026 with CERN as coordinator. Its 42 partners have four years to build prototypes of technologies researched over two decades, and Toms Torims, who coordinates it, expects that some will not work. </p></div>
<div class="wp-block-group fb-meta is-layout-flex wp-block-group-is-layout-flex"><div class="taxonomy-category is-plain wp-block-post-terms">Project</div>
<div class="wp-block-post-date"><time datetime="2026-11-12T12:00:00+01:00">12 November 2026</time></div>
<p class="wp-block-paragraph">7 min read</p>
</div>
<a class="fb-button wp-block-read-more" href="#epita-22-prototypes-by-2030" target="_self">Read the article<span class="screen-reader-text">: EPITA aims to build 22 working prototypes of accelerator technology by 2030</span></a></div>
</div>
</div>
<div class="wp-block-group fb-hero__foot has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<p class="alignwide fb-credit wp-block-paragraph">Linac4, the first link in the chain of proton accelerators at CERN. Photograph by Maximilien Brice for CERN, CC BY-SA 4.0.</p>
</div>
</li></ul></div>

<h2 class="wp-block-heading">Six articles on EPITA</h2>
<p class="fb-deck wp-block-paragraph">The lead story is above and the rest follow here. I wrote them together for this sample, from public sources that each article lists at the end.</p>
</div>
<div class="wp-block-query alignwide fb-cards is-lead is-layout-flow wp-block-query-is-layout-flow"><ul class="columns-3 wp-block-post-template is-layout-grid wp-container-core-post-template-is-layout-0d5c60d9 wp-block-post-template-is-layout-grid"><li class="wp-block-post post-353 post type-post status-publish format-standard has-post-thumbnail hentry category-project">
<figure class="wp-block-post-featured-image"><a aria-hidden="true" href="#who-leads-the-twelve-work-packages" tabindex="-1" target="_self"><img alt="" class="attachment-post-thumbnail size-post-thumbnail wp-post-image" decoding="async" height="1440" loading="lazy" sizes="auto, (max-width: 699px) 100vw, 600px" src="/newsroom/uploads/cern-aerial.jpg" srcset="/newsroom/uploads/cern-aerial.jpg 1920w, /newsroom/uploads/cern-aerial-300x225.jpg 300w, /newsroom/uploads/cern-aerial-1024x768.jpg 1024w, /newsroom/uploads/cern-aerial-768x576.jpg 768w, /newsroom/uploads/cern-aerial-1536x1152.jpg 1536w" style="object-fit:cover;" width="1920"/></a></figure>
<h3 class="wp-block-post-title"><a href="#who-leads-the-twelve-work-packages" target="_self">Who leads the twelve work packages of EPITA</a></h3>
<div class="wp-block-post-excerpt"><p class="wp-block-post-excerpt__excerpt">The project divides its work into twelve packages in four groups. Each one has one or two leaders, and only one of the lead organisations is a company. </p></div>
<div class="wp-block-group fb-meta is-layout-flex wp-block-group-is-layout-flex"><div class="taxonomy-category is-plain wp-block-post-terms">Project</div>
<p class="wp-block-paragraph">6 min read</p>
</div>
</li><li class="wp-block-post post-351 post type-post status-publish format-standard has-post-thumbnail hentry category-sustainability">
<figure class="wp-block-post-featured-image"><a aria-hidden="true" href="#common-method-sustainability-research-facilities" tabindex="-1" target="_self"><img alt="" class="attachment-post-thumbnail size-post-thumbnail wp-post-image" decoding="async" height="1600" loading="lazy" sizes="auto, (max-width: 699px) 100vw, 600px" src="/newsroom/uploads/hl-lhc-tunnel.jpg" srcset="/newsroom/uploads/hl-lhc-tunnel.jpg 2400w, /newsroom/uploads/hl-lhc-tunnel-300x200.jpg 300w, /newsroom/uploads/hl-lhc-tunnel-1024x683.jpg 1024w, /newsroom/uploads/hl-lhc-tunnel-768x512.jpg 768w, /newsroom/uploads/hl-lhc-tunnel-1536x1024.jpg 1536w, /newsroom/uploads/hl-lhc-tunnel-2048x1365.jpg 2048w" style="object-fit:cover;" width="2400"/></a></figure>
<h3 class="wp-block-post-title"><a href="#common-method-sustainability-research-facilities" target="_self">EPITA will develop a common way to assess the sustainability of research facilities</a></h3>
<div class="wp-block-post-excerpt"><p class="wp-block-post-excerpt__excerpt">A task in EPITA will give laboratories shared definitions for assessing their environmental impact, so that their results can be compared. It also includes training for engineers and researchers. </p></div>
<div class="wp-block-group fb-meta is-layout-flex wp-block-group-is-layout-flex"><div class="taxonomy-category is-plain wp-block-post-terms">Sustainability</div>
<p class="wp-block-paragraph">3 min read</p>
</div>
</li><li class="wp-block-post post-349 post type-post status-publish format-standard has-post-thumbnail hentry category-industry">
<figure class="wp-block-post-featured-image"><a aria-hidden="true" href="#sixteen-companies-take-part-in-epita" tabindex="-1" target="_self"><img alt="" class="attachment-post-thumbnail size-post-thumbnail wp-post-image" decoding="async" height="1280" loading="lazy" sizes="auto, (max-width: 699px) 100vw, 600px" src="/newsroom/uploads/iss-magnet.jpg" srcset="/newsroom/uploads/iss-magnet.jpg 1920w, /newsroom/uploads/iss-magnet-300x200.jpg 300w, /newsroom/uploads/iss-magnet-1024x683.jpg 1024w, /newsroom/uploads/iss-magnet-768x512.jpg 768w, /newsroom/uploads/iss-magnet-1536x1024.jpg 1536w" style="object-fit:cover;" width="1920"/></a></figure>
<h3 class="wp-block-post-title"><a href="#sixteen-companies-take-part-in-epita" target="_self">Sixteen deep-tech companies join laboratories to build accelerator prototypes</a></h3>
<div class="wp-block-post-excerpt"><p class="wp-block-post-excerpt__excerpt">More than a third of the partners in EPITA are companies, and one of them leads a work package. The coordinator does not think a project of this size coordinated by CERN has had so much industry before. </p></div>
<div class="wp-block-group fb-meta is-layout-flex wp-block-group-is-layout-flex"><div class="taxonomy-category is-plain wp-block-post-terms">Industry</div>
<p class="wp-block-paragraph">5 min read</p>
</div>
</li><li class="wp-block-post post-347 post type-post status-publish format-standard has-post-thumbnail hentry category-technology">
<figure class="wp-block-post-featured-image"><a aria-hidden="true" href="#permanent-magnets-work-package" tabindex="-1" target="_self"><img alt="" class="attachment-post-thumbnail size-post-thumbnail wp-post-image" decoding="async" height="1313" loading="lazy" sizes="auto, (max-width: 699px) 100vw, 600px" src="/newsroom/uploads/lcls-undulator.jpg" srcset="/newsroom/uploads/lcls-undulator.jpg 1920w, /newsroom/uploads/lcls-undulator-300x205.jpg 300w, /newsroom/uploads/lcls-undulator-1024x700.jpg 1024w, /newsroom/uploads/lcls-undulator-768x525.jpg 768w, /newsroom/uploads/lcls-undulator-1536x1050.jpg 1536w" style="object-fit:cover;--fb-focus:30% 40%;" width="1920"/></a></figure>
<h3 class="wp-block-post-title"><a href="#permanent-magnets-work-package" target="_self">Kyma leads the plan to turn a tunable permanent magnet into a product line</a></h3>
<div class="wp-block-post-excerpt"><p class="wp-block-post-excerpt__excerpt">Kyma, an Italian company, leads the work package on permanent magnets in EPITA. It is due to deliver a tunable quadrupole called ZEPTO-PRO, and a second team will build a wiggler for the damping rings of a proposed collider. </p></div>
<div class="wp-block-group fb-meta is-layout-flex wp-block-group-is-layout-flex"><div class="taxonomy-category is-plain wp-block-post-terms">Technology</div>
<p class="wp-block-paragraph">6 min read</p>
</div>
</li><li class="wp-block-post post-345 post type-post status-publish format-standard has-post-thumbnail hentry category-education">
<figure class="wp-block-post-featured-image"><a aria-hidden="true" href="#students-new-uses-for-accelerators" tabindex="-1" target="_self"><img alt="" class="attachment-post-thumbnail size-post-thumbnail wp-post-image" decoding="async" height="1280" loading="lazy" sizes="auto, (max-width: 699px) 100vw, 600px" src="/newsroom/uploads/science-gateway.jpg" srcset="/newsroom/uploads/science-gateway.jpg 1920w, /newsroom/uploads/science-gateway-300x200.jpg 300w, /newsroom/uploads/science-gateway-1024x683.jpg 1024w, /newsroom/uploads/science-gateway-768x512.jpg 768w, /newsroom/uploads/science-gateway-1536x1024.jpg 1536w" style="object-fit:cover;" width="1920"/></a></figure>
<h3 class="wp-block-post-title"><a href="#students-new-uses-for-accelerators" target="_self">EPITA plans two ten-day innovation challenges for students</a></h3>
<div class="wp-block-post-excerpt"><p class="wp-block-post-excerpt__excerpt">EPITA plans two Challenge-Based Innovation programmes for bachelor’s and master’s students. I.FAST, the project that came before it, held four, and a special edition was scheduled in Sarajevo this autumn. </p></div>
<div class="wp-block-group fb-meta is-layout-flex wp-block-group-is-layout-flex"><div class="taxonomy-category is-plain wp-block-post-terms">Education</div>
<p class="wp-block-paragraph">4 min read</p>
</div>
</li></ul></div>

<p class="wp-block-paragraph">One of these articles, told again for the newsletter and for social media. The facts stay the same and the writing changes with the reader.</p>

<div class="wp-block-group alignwide fb-about is-layout-flow wp-block-group-is-layout-flow">
<div class="wp-block-group fb-about__head is-layout-flow wp-block-group-is-layout-flow">
<h2 class="wp-block-heading">Why I made this site</h2>
<p class="fb-about__name wp-block-paragraph"><strong>Michael Cebral</strong><br/>Science communicator</p>
</div>
<div class="wp-block-group fb-about__text is-layout-flow wp-block-group-is-layout-flow">
<p class="wp-block-paragraph">Accelerators are used for much more than particle physics. They work in hospitals, in industry and in the study of materials, and the technology inside them keeps improving. I find that fascinating, and I think more people would if someone explained it to them clearly.</p>
<p class="wp-block-paragraph">I am Michael Cebral, a science communicator with a background in biomedical research, and this sample is my way of showing how I would do it. I chose EPITA because it is a new project with a lot to tell, and I wrote every article from public sources, most of them published by CERN, the project and the European Commission.</p>
<p class="fb-link wp-block-paragraph"><a href="#about">More about this sample</a></p>

<div class="wp-block-group is-layout-flow wp-block-group-is-layout-flow"><h1 class="wp-block-post-title">About this sample</h1>
<div class="wp-block-group fb-author is-layout-flow wp-block-group-is-layout-flow">
<div class="wp-block-group fb-author__who is-layout-flow wp-block-group-is-layout-flow">
<p class="fb-author__name wp-block-paragraph">Michael Cebral</p>
<p class="fb-author__role wp-block-paragraph">Science communicator</p>
</div>
<p class="fb-author__contact wp-block-paragraph">Contact <a href="https://mcebral.com">mcebral.com</a></p>
</div>
</div>
</div>
<div class="entry-content wp-block-post-content has-global-padding is-layout-constrained wp-block-post-content-is-layout-constrained">
<p class="wp-block-paragraph">This site is a work sample called Sample Newsroom. I am <a href="https://mcebral.com">Michael Cebral</a>, a science communicator trained as a biomedical researcher, and I made it to show how I would write, design and publish the news of a European project like EPITA.</p>
<h2 class="wp-block-heading">What you can find here</h2>
<p class="wp-block-paragraph">There are six news articles about EPITA, a Horizon Europe project on accelerator technology that CERN coordinates. I wrote them as a set in November 2026, six months after the project was launched, so they describe the project as its public sources present it today and are not breaking news.</p>
<p class="wp-block-paragraph">Everything in them comes from public sources, most of them published by CERN, the project and the European Commission. Each article lists its sources at the end so that anyone can check it. I quote people only in words that they have published, and when two sources give different figures I say so and explain which one I used.</p>
<p class="wp-block-paragraph">Five of the articles end with a note, written in the first person, that says where the sources disagree, which figure I used and what I added myself. The sixth, <a href="#common-method-sustainability-research-facilities">on the sustainability task</a>, is written in the voice that a project would use for its own news, so its note is here. The opening example of the two laboratories and the explanation of what a life cycle assessment is are mine and not the project’s. The rest comes from the sources listed at its end.</p>
<p class="wp-block-paragraph">There is also <a href="#formats">a page that takes one of the stories and shows it in four formats</a>, from the full article to an image card for social media.</p>
<h2 class="wp-block-heading">How I built it</h2>
<p class="wp-block-paragraph">I wrote the texts, designed the pages, drew the two diagrams and coded the WordPress theme myself. The site loads its fonts from its own server and uses no trackers and no cookies. The theme has no JavaScript of its own. It has short transitions, and they stop when a visitor has asked the browser to reduce motion. Every page can be used with a keyboard.</p>
<h2 class="wp-block-heading">What it is not</h2>
<p class="wp-block-paragraph">This is not an official website. It is not affiliated with or endorsed by CERN or the EPITA project, and it does not speak for them.</p>
<h2 class="wp-block-heading" id="credits">Photo credits</h2>
<p class="wp-block-paragraph">All photographs come from Wikimedia Commons and are used under the terms listed. They have been cropped and resized. The two diagrams and the image card are my own work.</p>

<div class="wp-block-group fb-page-head has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<div class="wp-block-group is-layout-flow wp-block-group-is-layout-flow"><h1 class="wp-block-post-title">One story in four formats</h1></div>
</div>
<div class="entry-content wp-block-post-content has-global-padding is-layout-constrained wp-block-post-content-is-layout-constrained">
<p class="wp-block-paragraph">A project tells each story several times. The same news goes to the website, to the newsletter and to social media, and each place asks for a different text. Here I take <a href="#permanent-magnets-work-package">the article on permanent magnets</a> and show it in four formats. The facts are the same in all of them and they come from the sources listed in the article.</p>
<div class="wp-block-group fb-format is-layout-flow wp-block-group-is-layout-flow">
<h2 class="wp-block-heading">1. The news article</h2>
<p class="fb-format__why wp-block-paragraph">This is the full version, with the explanations, the sources and a note on what I added myself. I wrote it for a reader who has time and wants to be able to check every statement. Only its headline and its first lines are shown here.</p>
<div class="wp-block-group fb-format__sample is-layout-flow wp-block-group-is-layout-flow is-article">
<p class="fb-format__title wp-block-paragraph fb-format__title"><strong><a href="#permanent-magnets-work-package">Kyma leads the plan to turn a tunable permanent magnet into a product line</a></strong></p>
<p class="wp-block-paragraph">Kyma, an Italian company, leads the work package on permanent magnets in EPITA. It is due to deliver a tunable quadrupole called ZEPTO-PRO, and a second team will build a wiggler for the damping rings of a proposed collider.</p>
</div>
</div>
<div class="wp-block-group fb-format is-layout-flow wp-block-group-is-layout-flow">
<h2 class="wp-block-heading">2. The newsletter item</h2>
<p class="fb-format__why wp-block-paragraph">People who receive the newsletter already know what an accelerator is, so the lead item leaves out the basic explanations and gives the news and what happens first. The subject line and the preview text have to make sense alone in an inbox, and each of the two teasers has one line to say what its article offers. The issue is a mock one, made for this sample.</p>
<div class="wp-block-group fb-format__sample is-layout-flow wp-block-group-is-layout-flow is-newsletter">
<p class="fb-kicker wp-block-paragraph">Sample Newsroom newsletter, a mock issue for November 2026</p>
<div aria-hidden="true" class="wp-block-spacer" style="height:0.5rem"></div>
<p class="fb-kicker wp-block-paragraph">Subject line</p>
<p class="wp-block-paragraph">Kyma to deliver a plug-and-play prototype of a tunable magnet</p>
<div aria-hidden="true" class="wp-block-spacer" style="height:0.5rem"></div>
<p class="fb-kicker wp-block-paragraph">Preview text</p>
<p class="wp-block-paragraph">A review and two workshops will first define what future quadrupoles need.</p>
<div aria-hidden="true" class="wp-block-spacer" style="height:0.5rem"></div>
<p class="fb-kicker wp-block-paragraph">Lead item</p>
<p class="fb-format__title wp-block-paragraph fb-format__title"><strong><a href="#permanent-magnets-work-package">Permanent magnets on the way to a product line</a></strong></p>
<p class="wp-block-paragraph">Kyma leads work package 7 of EPITA and is due to deliver a plug-and-play prototype of ZEPTO-PRO, a tunable permanent magnet quadrupole. The requirements come first. A review of the magnets built so far and two workshops, one for magnet designers and one for accelerator designers, will define what future quadrupoles need. DESY, which is upgrading its PETRA accelerator, takes part so that the result matches what European facilities need.</p>
<p class="wp-block-paragraph"><a href="#permanent-magnets-work-package">Read the article</a></p>
<div aria-hidden="true" class="wp-block-spacer" style="height:0.5rem"></div>
<p class="fb-kicker wp-block-paragraph">Also in this issue</p>
<p class="wp-block-paragraph"><a href="#sixteen-companies-take-part-in-epita">Sixteen deep-tech companies</a> take part in EPITA, by the project’s own count, and one of them leads a work package.</p>
<p class="wp-block-paragraph"><a href="#students-new-uses-for-accelerators">Two ten-day challenges</a> will ask students to propose new uses for accelerators.</p>
</div>
</div>
<div class="wp-block-group fb-format is-layout-flow wp-block-group-is-layout-flow">
<h2 class="wp-block-heading">3. The LinkedIn post</h2>
<p class="fb-format__why wp-block-paragraph">On LinkedIn only the first two lines are visible before a reader decides to open the post, so they carry the idea in words that anyone can follow. After them come one fact, the organisations that can be tagged and an invitation to read the article. Three plain tags close the post.</p>
<div class="wp-block-group fb-format__sample is-layout-flow wp-block-group-is-layout-flow is-social">
<p class="wp-block-paragraph">Most magnets in a particle accelerator draw electricity for as long as they are switched on.<br/>A permanent magnet holds its field with no current at all.</p>
<p class="wp-block-paragraph">The difficulty is that a simple permanent magnet has one fixed strength, and accelerators need magnets that can be adjusted. In EPITA, a European project coordinated by CERN, the Italian company Kyma leads the work to turn a tunable one into a product line. It is the only one of the twelve work packages of the project that a company leads.</p>
<p class="wp-block-paragraph">Read <a href="#permanent-magnets-work-package">the article</a> to see how the magnet is meant to go from prototype to product line. Every source is listed at the end.</p>
<p class="wp-block-paragraph">#ParticleAccelerators #PermanentMagnets #AcceleratorTechnology</p>
</div>
</div>
<div class="wp-block-group fb-format is-layout-flow wp-block-group-is-layout-flow">

<p class="fb-format__why wp-block-paragraph">An image card is often seen far from the article, so it has to make sense alone. The words and the drawing say the same thing, one line places it in the project, and the name of the site closes it. I leave everything else out, because most people will see it small, on a phone.</p>

<article class="wp-block-group is-layout-flow wp-block-group-is-layout-flow">
<div class="wp-block-group fb-article-head has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<div class="wp-block-group is-layout-flow wp-block-group-is-layout-flow"><h1 class="wp-block-post-title">EPITA will develop a common way to assess the sustainability of research facilities</h1>
<div class="wp-block-post-excerpt"><p class="wp-block-post-excerpt__excerpt">A task in EPITA will give laboratories shared definitions for assessing their environmental impact, so that their results can be compared. It also includes training for engineers and researchers. </p></div>
<div class="wp-block-group fb-meta is-layout-flex wp-block-group-is-layout-flex"><div class="taxonomy-category wp-block-post-terms"><a href="#category-sustainability" rel="tag">Sustainability</a></div>
<div class="wp-block-post-author-name">Michael Cebral</div>
<div class="wp-block-post-date"><time datetime="2026-11-12T10:00:00+01:00">12 November 2026</time></div>
<p class="wp-block-paragraph">3 min read</p>
</div>
</div>
</div>
<div class="wp-block-group fb-article-figure has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<div class="wp-block-group alignwide is-layout-flow wp-block-group-is-layout-flow"><figure class="is-wide wp-block-post-featured-image"><img alt="A worker in a white helmet and an orange vest, seen from behind, walks along a new concrete tunnel with cable trays on both walls and ventilation ducts overhead" class="attachment-post-thumbnail size-post-thumbnail wp-post-image" decoding="async" fetchpriority="high" height="1600" loading="eager" sizes="(max-width: 1280px) 100vw, 1200px" src="/newsroom/uploads/hl-lhc-tunnel.jpg" srcset="/newsroom/uploads/hl-lhc-tunnel.jpg 2400w, /newsroom/uploads/hl-lhc-tunnel-300x200.jpg 300w, /newsroom/uploads/hl-lhc-tunnel-1024x683.jpg 1024w, /newsroom/uploads/hl-lhc-tunnel-768x512.jpg 768w, /newsroom/uploads/hl-lhc-tunnel-1536x1024.jpg 1536w, /newsroom/uploads/hl-lhc-tunnel-2048x1365.jpg 2048w" style="object-fit:cover;" width="2400"/></figure>
<p class="fb-credit wp-block-paragraph">A new tunnel built at CERN for the High-Luminosity LHC. Photograph by Mmma98, CC BY-SA 4.0.</p>
</div>
</div>
<div class="entry-content wp-block-post-content has-global-padding is-layout-constrained wp-block-post-content-is-layout-constrained">
<div class="wp-block-group is-style-brief is-layout-flow wp-block-group-is-layout-flow">
<p class="fb-eyebrow wp-block-paragraph">Key points</p>
<ul class="wp-block-list">
<li>A task in EPITA will develop and harmonise methods to assess the sustainability of large research infrastructures.</li>
<li>It will align carbon footprints, life cycle assessments and sustainability indicators under shared definitions and system boundaries.</li>
<li>It will also pilot training modules on sustainable design for engineers and researchers.</li>
</ul>
</div>
<p class="wp-block-paragraph">EPITA, the European project on accelerator technology coordinated by CERN, will develop and harmonise methods to assess and improve sustainability in large research infrastructures, the big shared facilities that include accelerators. One of its tasks is dedicated to this.</p>
<p class="wp-block-paragraph">An example shows why it is needed. Two laboratories can each publish the environmental impact of an accelerator and still produce figures that cannot be compared. If one study counts the concrete of the tunnel and the other counts only the electricity, the two numbers describe different things. The line between what is counted and what is left out is called the system boundary.</p>
<h2 class="wp-block-heading">What the task will do</h2>
<p class="wp-block-paragraph">The task builds on existing efforts, from energy efficiency measures to environmental life cycle assessments and advanced ways of managing data, and its job is to make them fit together. It will align carbon footprints, life cycle assessments and sustainability indicators, harmonise their definitions and system boundaries, and write guidelines adapted to research infrastructures.</p>
<p class="wp-block-paragraph">The common framework is meant for publicly funded research institutions. International workshops and outside experts will support the work, which has to balance scientific excellence, the operation of the facilities and the requirements of funders. The task will also refine two tools that are already in common use, life cycle assessment and design for sustainability.</p>
<p class="wp-block-paragraph">Denise Völker of the German laboratory DESY leads the task, and the Spanish research centre CIEMAT takes part.</p>
<h2 class="wp-block-heading">What a life cycle assessment is</h2>
<p class="wp-block-paragraph">A life cycle assessment adds up the environmental impact of something during its whole life, from the raw materials needed to build it to the day it is dismantled. For an accelerator that can include the concrete of the tunnel, the metals in the magnets and the electricity used during decades of operation.</p>
<h2 class="wp-block-heading">Training for the people who design accelerators</h2>
<p class="wp-block-paragraph">The task also has a training side. It introduces a seminar concept called Design for Sustainability, shortened to D4S, and it will pilot training modules for engineers and researchers. The modules are meant to build practical skills in choosing materials sustainably, in life cycle thinking and in judging technical feasibility.</p>
<h2 class="wp-block-heading">Part of a wider aim</h2>
<p class="wp-block-paragraph">The task belongs to the work package on strategic communication, outreach and sustainability, led by Philip Burrows of the University of Oxford.</p>
<figure class="wp-block-pullquote has-open-quote"><blockquote><p>“Our work package aims to enhance the impact of EPITA’s achievements across the accelerator technology sector, promote sustainable solutions, and advance accelerator-based applications for societal benefit.”</p><cite>Philip Burrows, University of Oxford, leader of work package 2, on the project website</cite></blockquote></figure>
<p class="wp-block-paragraph">Sustainability appears in the technical work too. The project website says that EPITA should allow the accelerator-based research infrastructures of Europe to evolve in a resource-efficient way. <a href="#permanent-magnets-work-package">The work package on permanent magnets</a> is one example. Its leader, Raffaella Geometrante of the company Kyma, argues that such magnets can help to reduce energy consumption.</p>
<p class="wp-block-paragraph">The work package that hosts the task also organises <a href="#students-new-uses-for-accelerators">the innovation programmes for students</a>. Dates for the workshops and the training modules have not yet been announced.</p>

<main class="wp-block-group is-layout-flow wp-block-group-is-layout-flow" id="wp--skip-link--target">
<article class="wp-block-group is-layout-flow wp-block-group-is-layout-flow">
<div class="wp-block-group fb-article-head has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<div class="wp-block-group is-layout-flow wp-block-group-is-layout-flow"><h1 class="wp-block-post-title">Kyma leads the plan to turn a tunable permanent magnet into a product line</h1>
<div class="wp-block-post-excerpt"><p class="wp-block-post-excerpt__excerpt">Kyma, an Italian company, leads the work package on permanent magnets in EPITA. It is due to deliver a tunable quadrupole called ZEPTO-PRO, and a second team will build a wiggler for the damping rings of a proposed collider. </p></div>
<div class="wp-block-group fb-meta is-layout-flex wp-block-group-is-layout-flex"><div class="taxonomy-category wp-block-post-terms"><a href="#category-technology" rel="tag">Technology</a></div>
<div class="wp-block-post-author-name">Michael Cebral</div>
<div class="wp-block-post-date"><time datetime="2026-11-12T08:00:00+01:00">12 November 2026</time></div>
<p class="wp-block-paragraph">6 min read</p>
</div>
</div>
</div>
<div class="wp-block-group fb-article-figure has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<div class="wp-block-group alignwide is-layout-flow wp-block-group-is-layout-flow"><figure class="is-wide wp-block-post-featured-image"><img alt="A person in a white helmet and a white coat reaches up to a long array of magnets that hangs from two green straps. Rows of small magnet blocks run along it, and polished metal cylinders lie on supports in the foreground" class="attachment-post-thumbnail size-post-thumbnail wp-post-image" decoding="async" fetchpriority="high" height="1313" loading="eager" sizes="(max-width: 1280px) 100vw, 1200px" src="/newsroom/uploads/lcls-undulator.jpg" srcset="/newsroom/uploads/lcls-undulator.jpg 1920w, /newsroom/uploads/lcls-undulator-300x205.jpg 300w, /newsroom/uploads/lcls-undulator-1024x700.jpg 1024w, /newsroom/uploads/lcls-undulator-768x525.jpg 768w, /newsroom/uploads/lcls-undulator-1536x1050.jpg 1536w" style="object-fit:cover;--fb-focus:30% 40%;" width="1920"/></figure>
<p class="fb-credit wp-block-paragraph">A member of staff inspects one of the undulator magnets designed for the Linac Coherent Light Source at SLAC, in the United States. An undulator is a close relative of the wiggler, and this one is not part of EPITA. Photograph by the U.S. Department of Energy, public domain.</p>
</div>
</div>
<div class="entry-content wp-block-post-content has-global-padding is-layout-constrained wp-block-post-content-is-layout-constrained">
<div class="wp-block-group is-style-brief is-layout-flow wp-block-group-is-layout-flow">
<p class="fb-eyebrow wp-block-paragraph">Key points</p>
<ul class="wp-block-list">
<li>Work package 7 of EPITA is dedicated to permanent magnets and is led by Raffaella Geometrante, managing director of the company Kyma.</li>
<li>Its main device is ZEPTO-PRO, a permanent magnet quadrupole whose strength can be adjusted. The aim is to take it from level 6 to level 7 of technology readiness.</li>
<li>A second prototype is a permanent magnet wiggler for the damping rings of FCC-ee. The 2026 update of the European Strategy for Particle Physics recommends this collider as the preferred option for the next flagship project at CERN.</li>
</ul>
</div>
<p class="wp-block-paragraph">Most magnets in a large accelerator are electromagnets. They produce a field only while current flows through their coils, and the strongest ones are superconducting and have to be kept extremely cold. A permanent magnet works differently because its field comes from the material itself, so holding that field takes no current.</p>
<p class="wp-block-paragraph">EPITA, the European project on accelerator technology that CERN coordinates, dedicates one of its twelve work packages to permanent magnets. It is the only one led by a company. Raffaella Geometrante, managing director of Kyma, is in charge, and she argues on the project website that these magnets can help to reduce energy consumption.</p>
<h2 class="wp-block-heading">A field that can be adjusted</h2>
<p class="wp-block-paragraph">A simple permanent magnet has one fixed strength, while the people who run an accelerator often need to adjust their magnets. The work package therefore concentrates on tunable designs. A tunable magnet still needs a mechanism to change its strength, and the field of permanent magnet material drifts with temperature, so the magnet needs a stable temperature. What it avoids is the current that an electromagnet draws for as long as it is switched on.</p>
<h2 class="wp-block-heading">ZEPTO-PRO, a quadrupole for production</h2>
<p class="wp-block-paragraph">The main device is called ZEPTO-PRO. It is a quadrupole, the kind of magnet that focuses the beam, and it is based on ZEPTO, a tunable permanent magnet. The project website names UKRI, the public research agency of the United Kingdom, as the originator of ZEPTO.</p>
<p class="wp-block-paragraph">The name stands for Zero Power Tunable Optics, according to an article that Accelerating News published in 2022. In the design described there, blocks of permanent magnet material move relative to fixed steel poles, and the position of the blocks sets the strength of the magnet. The EPITA pages do not say how ZEPTO-PRO will be tuned.</p>
<p class="wp-block-paragraph">The first task reviews the ZEPTO magnets and other permanent magnets that UKRI and Kyma have already built. It compares them with what was originally specified, analyses their cost and sets them against other tunable permanent magnet technologies. It also includes two workshops. In one, magnet designers will check the findings. In the other, accelerator designers will look at where these devices could replace electromagnets.</p>
<p class="wp-block-paragraph">The second task turns that review into engineering. Ben Shepherd of UKRI leads this task, with Kyma and DESY as partners. Its goal is a modular design for a product line of tunable quadrupoles that can be customised. The website presents the ways to simplify the design as potential paths, not as decisions already taken. They are a modular holder for the magnet blocks, a standard way of machining and adjusting the poles, families of magnets that share the same outer dimensions, and an assembly line with a test bench.</p>
<p class="wp-block-paragraph">Kyma is due to deliver a prototype that the project describes as plug-and-play and suitable for broad deployment. UKRI is responsible for taking the technology from level 6 to level 7 on the technology readiness scale, which has nine levels and measures how close a technology is to real use. In the definitions of the European Commission, level 6 means that a technology has been demonstrated in a relevant environment. Level 7 means that a prototype of the whole system has been demonstrated in an operational environment.</p>
<h2 class="wp-block-heading">A wiggler for damping rings</h2>
<p class="wp-block-paragraph">The second prototype is a wiggler made of permanent magnets, and it is the subject of the third task. A wiggler is built from two rows of magnets with alternating poles, and it makes a beam weave from side to side. This one is meant for damping rings.</p>
<p class="wp-block-paragraph">A damping ring is a small ring where a beam of electrons or positrons that has already been accelerated circulates for a short time. Whenever a magnet bends the path of a particle, the particle gives off light and loses a little momentum along the direction in which it is moving at that instant, and this includes the small sideways part of its motion. The radiofrequency cavities of the ring restore the lost momentum only along the direction of the beam. Turn after turn the sideways motion therefore fades, and the beam becomes narrower and more orderly. The shrinking does not go on for ever. The light leaves in separate packets that jostle the particles at random, and the beam settles at an equilibrium size where the two effects balance. A wiggler makes the particles radiate much more than the bending magnets alone, so the beam reaches that equilibrium sooner.</p>
<figure class="wp-block-image size-full fb-figure"><picture><source height="2143" media="(max-width: 899px)" srcset="/newsroom/assets/graphics/damping-ring-wiggler-mobile.svg" width="360"><img alt="Drawing in two parts. Above, a ring of pipe seen at an angle, with five blue bending magnets, a grey cavity and a short wiggler. A wide, fuzzy beam of particles, labelled beam in, joins the ring at the upper left. The beam runs round the ring clockwise for thousands of turns, and copper-coloured light flies off forwards at every bending magnet. A thin, sharp beam, labelled beam out, leaves the ring at the lower left. Four numbered notes say that the beam goes in wide, that every bend makes it give off light, which takes away a little of all its motion including the sideways part, that the cavity pushes it only forwards, and that the sideways motion is never given back, so the beam comes out narrow at a steady size. Below, on a dark panel, a close view of the wiggler shows two rows of magnet blocks, one above the beam and one below, with north and south poles alternating and opposite poles facing each other. Between the rows lies a flat sheet, and on it the beam follows a wave from side to side and gives off light forwards at every bend." decoding="async" height="1120" src="/newsroom/assets/graphics/damping-ring-wiggler.svg" width="1100"/></source></picture><figcaption class="wp-element-caption">Simplified diagram, not to scale. A real ring has many more magnets, and the wave in the wiggler is exaggerated. Graphic by Michael Cebral.</figcaption></figure>
<p class="wp-block-paragraph">The rings in this task are meant for the injection of electrons and positrons into FCC-ee. The update of the European Strategy for Particle Physics agreed in May 2026 recommends this collider as the preferred option for the next flagship project at CERN, and CERN says that the Council should be in a position to take a decision on it by 2028. The task will design compact rings with high-field permanent magnets, and the work package page sets a shorter damping time and a ring of minimal circumference among the goals. CERN leads the design of the rings and defines what the magnets must achieve. The Spanish research centre CIEMAT and the company ProactiveRD will design the wiggler and build the prototype, which will then go through magnetic measurements and tests.</p>
<h2 class="wp-block-heading">Industry in the lead</h2>
<p class="wp-block-paragraph">Geometrante calls permanent magnets “a strategic technology, both for research infrastructures and for Europe more broadly”. In her statement on the project website she explains that the work is conceived from the beginning with standardisation and manufacturing in mind, and that the ambition goes further than laboratory-scale prototypes.</p>
<figure class="wp-block-pullquote has-open-quote"><blockquote><p>“A key point is that industry is not involved only as a supplier, but as an active driver of innovation, bringing both technological capabilities and an implementation-oriented mindset.”</p><cite>Raffaella Geometrante, managing director of Kyma, leader of work package 7, on the project website</cite></blockquote></figure>
<p class="wp-block-paragraph">Six organisations share the work package. One of them, the German laboratory DESY, is upgrading its PETRA accelerator and will check that the work matches what European facilities need.</p>
<p class="wp-block-paragraph">The other companies in the project are in <a href="#sixteen-companies-take-part-in-epita">the article about industry</a>. The same story is told again for a newsletter and for social media, and <a href="#formats">the four versions are side by side on a separate page</a>.</p>
<div class="wp-block-group is-style-note is-layout-flow wp-block-group-is-layout-flow">
<p class="fb-eyebrow wp-block-paragraph">About the explanations</p>
<p class="wp-block-paragraph">I wrote the explanations of how permanent magnets differ from electromagnets, including the remark on temperature, and those of the quadrupole, the wiggler, the damping ring and the technology readiness scale. They do not come from the project. The drawing is mine too, and the definitions of levels 6 and 7 are those of the European Commission.</p>
<p class="wp-block-paragraph">The work package page uses the abbreviation HF for the wiggler. The Structure page of the same website spells it out as High-Field, and I have followed it.</p>
<p class="wp-block-paragraph">The Prototypes page files ZEPTO-PRO under task 7.1 and the wiggler under task 7.2. The Structure page and the work package page put the product line in task 7.2 and the wiggler in task 7.3, and I have followed them.</p>
</div>

<article class="wp-block-group is-layout-flow wp-block-group-is-layout-flow">
<div class="wp-block-group fb-article-head has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<div class="wp-block-group is-layout-flow wp-block-group-is-layout-flow"><h1 class="wp-block-post-title">EPITA plans two ten-day innovation challenges for students</h1>
<div class="wp-block-post-excerpt"><p class="wp-block-post-excerpt__excerpt">EPITA plans two Challenge-Based Innovation programmes for bachelor’s and master’s students. I.FAST, the project that came before it, held four, and a special edition was scheduled in Sarajevo this autumn. </p></div>
<div class="wp-block-group fb-meta is-layout-flex wp-block-group-is-layout-flex"><div class="taxonomy-category wp-block-post-terms"><a href="#category-education" rel="tag">Education</a></div>
<div class="wp-block-post-author-name">Michael Cebral</div>
<div class="wp-block-post-date"><time datetime="2026-11-12T07:00:00+01:00">12 November 2026</time></div>
<p class="wp-block-paragraph">4 min read</p>
</div>
</div>
</div>
<div class="wp-block-group fb-article-figure has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<div class="wp-block-group alignwide is-layout-flow wp-block-group-is-layout-flow"><figure class="is-wide wp-block-post-featured-image"><img alt="Two white buildings with roofs of solar panels, joined by a glass bridge, seen across a garden of young trees and paths under a blue sky" class="attachment-post-thumbnail size-post-thumbnail wp-post-image" decoding="async" fetchpriority="high" height="1280" loading="eager" sizes="(max-width: 1280px) 100vw, 1200px" src="/newsroom/uploads/science-gateway.jpg" srcset="/newsroom/uploads/science-gateway.jpg 1920w, /newsroom/uploads/science-gateway-300x200.jpg 300w, /newsroom/uploads/science-gateway-1024x683.jpg 1024w, /newsroom/uploads/science-gateway-768x512.jpg 768w, /newsroom/uploads/science-gateway-1536x1024.jpg 1536w" style="object-fit:cover;" width="1920"/></figure>
<p class="fb-credit wp-block-paragraph">CERN Science Gateway, the education and outreach centre that CERN opened in 2023. Photograph by Mike Peel (www.mikepeel.net), CC BY-SA 4.0.</p>
</div>
</div>
<div class="entry-content wp-block-post-content has-global-padding is-layout-constrained wp-block-post-content-is-layout-constrained">
<div class="wp-block-group is-style-brief is-layout-flow wp-block-group-is-layout-flow">
<p class="fb-eyebrow wp-block-paragraph">Key points</p>
<ul class="wp-block-list">
<li>EPITA plans two Challenge-Based Innovation programmes of ten days each, with four teams of students in each.</li>
<li>The model comes from I.FAST, whose fourth and last event brought 24 students from 14 countries to Archamps, near Geneva, in July 2025.</li>
<li>The project website does not yet give the topics or the dates.</li>
</ul>
</div>
<p class="wp-block-paragraph">EPITA, the European project on accelerator technology that CERN coordinates, plans two ten-day programmes in which students propose new uses for accelerators. The model comes from I.FAST, the project that came before it. At the fourth and last I.FAST event, in July 2025, 24 students from 14 countries spent nine days near Geneva working out how accelerators could help to solve medical problems, and then presented their ideas to a panel of judges at CERN.</p>
<p class="wp-block-paragraph">Nicolas Delerue, an accelerator specialist at CNRS and Université Paris-Saclay, coordinated that event. According to the Structure page of the EPITA website he also leads the task that will organise the new ones.</p>
<figure class="wp-block-pullquote has-open-quote"><blockquote><p>“I am convinced that this is a great investment for their future and for Europe’s future.”</p><cite>Nicolas Delerue, coordinator of the I.FAST challenge, on the 2025 students, in Accelerating News, 12 September 2025</cite></blockquote></figure>
<p class="wp-block-paragraph">One of the members of the winning team was Ajla Džaka, who was doing a master’s degree in electrical engineering at the University of Sarajevo. “We worked a lot and I learned a lot about things that are not in my area of expertise”, she told the newsletter.</p>
<h2 class="wp-block-heading">What EPITA plans</h2>
<p class="wp-block-paragraph">The work package page describes two programmes of ten days each. Every challenge brings together four teams of students who come from different countries and different fields of study. They receive lectures and mentoring from experts before and during the challenge.</p>
<p class="wp-block-paragraph">At the end each team presents its solution to a jury of scientists and knowledge transfer experts. The jury assesses each idea on its technical feasibility, its potential for innovation and its relevance for society.</p>
<p class="wp-block-paragraph">The article that CERN published about the launch of EPITA says the events are for students in the last years of a bachelor’s degree and for master’s students, and that they end with the teams pitching new uses for accelerators in a chosen topic area.</p>
<p class="wp-block-paragraph">The programmes belong to the work package on communication, outreach and sustainability, led by Philip Burrows of the University of Oxford. One of the aims he gives for it is to advance the applications of accelerators that benefit society. The same work package includes <a href="#common-method-sustainability-research-facilities">a task on how laboratories assess their environmental impact</a>.</p>
<h2 class="wp-block-heading">What I.FAST did</h2>
<p class="wp-block-paragraph">I.FAST organised four of these events, the first two about the environment and the last two about healthcare. In the fourth one the students worked in four teams of six. The winners called their team IrradiAID+ and proposed a treatment based on a new radioactive medicine for infections caused by MRSA, a bacterium that resists antibiotics.</p>
<h2 class="wp-block-heading">The special edition in Sarajevo</h2>
<p class="wp-block-paragraph">In March 2026 Accelerating News published a call, signed by Delerue, for a special edition in Sarajevo. It was scheduled from 22 September to 1 October 2026 and dedicated to applications of particle accelerators for society. The call presents it as a continuation of the four I.FAST events. A page of the European Scientific Institute in Archamps, which hosted the 2025 edition together with CERN, says the special edition was put forward by the Three Physicist Foundation and the Horizon project IFIGENEIA with several academic partners, CERN among them. Neither that page nor the call mentions EPITA, so it is not counted here as one of the two EPITA programmes.</p>
<p class="wp-block-paragraph">The event page on Indico, the system that CERN uses to organise meetings, places it at the University of Sarajevo and now carries three photographs, two of them labelled as students of the challenge. A search on 12 November 2026 found no public report of how it went or which team won.</p>
<div class="wp-block-group is-style-note is-layout-flow wp-block-group-is-layout-flow">
<p class="fb-eyebrow wp-block-paragraph">About the length and the dates</p>
<p class="wp-block-paragraph">The sources do not agree on the length of the EPITA programmes. The work package page speaks of 10 days and a news post on the project website of ten days, while the article that CERN published about the launch describes a programme of one week. I have used ten days.</p>
<p class="wp-block-paragraph">The report on the I.FAST event of 2025 says that the teams spent nine days in Archamps before they presented their projects at CERN on 31 July, while one participant quoted in it speaks of “just 10 days”.</p>
<p class="wp-block-paragraph">The project website does not give the topics or the dates of the two EPITA programmes yet.</p>
</div>

<article class="wp-block-group is-layout-flow wp-block-group-is-layout-flow">
<div class="wp-block-group fb-article-head has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<div class="wp-block-group is-layout-flow wp-block-group-is-layout-flow"><h1 class="wp-block-post-title">EPITA aims to build 22 working prototypes of accelerator technology by 2030</h1>
<div class="wp-block-post-excerpt"><p class="wp-block-post-excerpt__excerpt">The European project started in May 2026 with CERN as coordinator. Its 42 partners have four years to build prototypes of technologies researched over two decades, and Toms Torims, who coordinates it, expects that some will not work. </p></div>
<div class="wp-block-group fb-meta is-layout-flex wp-block-group-is-layout-flex"><div class="taxonomy-category wp-block-post-terms"><a href="#category-project" rel="tag">Project</a></div>
<div class="wp-block-post-author-name">Michael Cebral</div>
<div class="wp-block-post-date"><time datetime="2026-11-12T12:00:00+01:00">12 November 2026</time></div>
<p class="wp-block-paragraph">7 min read</p>
</div>
</div>
</div>
<div class="wp-block-group fb-article-figure has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<div class="wp-block-group alignwide is-layout-flow wp-block-group-is-layout-flow"><figure class="is-wide wp-block-post-featured-image"><img alt="A person in a white helmet walks along a corridor beside a long row of copper accelerator tanks that rest on yellow supports and are fed by black hoses" class="attachment-post-thumbnail size-post-thumbnail wp-post-image" decoding="async" fetchpriority="high" height="1708" loading="eager" sizes="(max-width: 1280px) 100vw, 1200px" src="/newsroom/uploads/linac4.jpg" srcset="/newsroom/uploads/linac4.jpg 2560w, /newsroom/uploads/linac4-300x200.jpg 300w, /newsroom/uploads/linac4-1024x683.jpg 1024w, /newsroom/uploads/linac4-768x512.jpg 768w, /newsroom/uploads/linac4-1536x1025.jpg 1536w, /newsroom/uploads/linac4-2048x1366.jpg 2048w" style="object-fit:cover;--fb-focus:17% 50%;" width="2560"/></figure>
<p class="fb-credit wp-block-paragraph">Linac4, the first link in the chain of proton accelerators at CERN. Photograph by Maximilien Brice for CERN, CC BY-SA 4.0.</p>
</div>
</div>
<div class="entry-content wp-block-post-content has-global-padding is-layout-constrained wp-block-post-content-is-layout-constrained">
<div class="wp-block-group is-style-brief is-layout-flow wp-block-group-is-layout-flow">
<p class="fb-eyebrow wp-block-paragraph">Key points</p>
<ul class="wp-block-list">
<li>EPITA aims to build 22 working prototypes of new accelerator technology between May 2026 and April 2030.</li>
<li>The project website counts <mark>42 partners</mark> in 15 countries, 16 of them deep-tech companies.</li>
<li>The European Union contributes <mark>€10 million</mark> through Horizon Europe and the partners add €11 million in matching funds.</li>
</ul>
</div>
<p class="wp-block-paragraph">A new accelerator technology can spend many years in the laboratory before anyone is able to use it in a real machine. EPITA, a European project coordinated by CERN, aims to take a group of such technologies out of the laboratory and build <mark>22 working prototypes</mark> by 2030. The project describes them as technologies that have been researched over the past two decades.</p>
<p class="wp-block-paragraph">The name stands for Enabling Partnerships for Innovation and Accelerator Technology Advancement. According to the record of the European Commission, the project began on 1 May 2026 and ends on 30 April 2030. The partners met at CERN on 12 and 13 May for the launch. EPITA builds on I.FAST, an earlier European project that ended on 31 October 2025.</p>
<p class="wp-block-paragraph">Not every prototype is expected to succeed. Toms Torims of CERN, who coordinates the project, said so openly in an interview published in March 2026, before the work began.</p>
<figure class="wp-block-pullquote has-open-quote"><blockquote><p>“Of course, some of them will not work, but that’s the nature of science.”</p><cite>Toms Torims, coordinator of EPITA, in an interview first published in Accelerating News on 13 March 2026</cite></blockquote></figure>
<p class="wp-block-paragraph">He went on to say that the project will show what works and what does not, and that he sees this as a good thing.</p>
<h2 class="wp-block-heading">The 22 prototypes</h2>
<p class="wp-block-paragraph">The technical work is organised in three areas. Accelerating systems are the parts that give particles their energy. Magnets and beamlines steer and focus the beam, and in this project the area also includes the injectors where an electron beam is created. The third area, frontier technologies, covers surface treatments, additive manufacturing and advanced materials.</p>
<p class="wp-block-paragraph">The project website lists the prototypes one by one. The table gives them in plain words, so the names differ a little from the official ones.</p>
<figure class="has-index wp-block-table fb-table"><table aria-label="The 22 prototypes"><thead><tr><th scope="col">No.</th><th scope="col">Prototype</th><th scope="col">Work package</th></tr></thead><tbody><tr><td>1</td><td>A cryomodule with a single-cell cavity that works at 1.3 GHz</td><td>Thin films (4)</td></tr><tr><td>2</td><td>Single-cell copper cavities for 1.3 GHz coated with niobium-tin</td><td>Thin films (4)</td></tr><tr><td>3</td><td>A lightweight laser mirror of silicon carbide with a stress-compensating coating</td><td>Lasers (5)</td></tr><tr><td>4</td><td>A curved capillary that bends a beam with plasma</td><td>Lasers (5)</td></tr><tr><td>5</td><td>A dielectric structure where the laser travels along with the beam</td><td>Lasers (5)</td></tr><tr><td>6</td><td>A high-efficiency magnetron for 1.3 GHz</td><td>Radiofrequency (6)</td></tr><tr><td>7</td><td>A ferroelectric fast reactive tuner with a high repetition rate</td><td>Radiofrequency (6)</td></tr><tr><td>8</td><td>A high-voltage pulser with a high repetition rate</td><td>Radiofrequency (6)</td></tr><tr><td>9</td><td>A disc with wide soldered tapes of high-temperature superconductor</td><td>Radiofrequency (6)</td></tr><tr><td>10</td><td>ZEPTO-PRO, a tunable permanent magnet quadrupole made ready for industry</td><td>Permanent magnets (7)</td></tr><tr><td>11</td><td>A permanent magnet wiggler</td><td>Permanent magnets (7)</td></tr><tr><td>12</td><td>A split-coil magnet of high-temperature superconductor with a cooling system that needs no liquid cryogen</td><td>Superconducting magnets (8)</td></tr><tr><td>13</td><td>A high-temperature superconductor cable for fast ramping</td><td>Superconducting magnets (8)</td></tr><tr><td>14</td><td>A chirping cavity</td><td>Electron injectors (9)</td></tr><tr><td>15</td><td>A transverse deflecting structure with several cells</td><td>Electron injectors (9)</td></tr><tr><td>16</td><td>A cavity prototype with a high quality factor at a high gradient</td><td>Surface treatments (10)</td></tr><tr><td>17</td><td>A high-pressure rinsing station that works with a collaborative robot</td><td>Surface treatments (10)</td></tr><tr><td>18</td><td>A radiofrequency quadrupole made by additive manufacturing</td><td>Additive manufacturing (11)</td></tr><tr><td>19</td><td>An interdigital H-mode drift tube linac, known as IH-DTL, made by additive manufacturing</td><td>Additive manufacturing (11)</td></tr><tr><td>20</td><td>A low-loss collector for electron guns</td><td>Additive manufacturing (11)</td></tr><tr><td>21</td><td>Beam absorbers made of carbide and carbon</td><td>Advanced materials (12)</td></tr><tr><td>22</td><td>Targets made of a refractory high-entropy alloy</td><td>Advanced materials (12)</td></tr></tbody></table></figure>
<p class="wp-block-paragraph">Torims has singled out a few of them. In the March interview he described a range that runs from cryomodules, the insulated vessels that keep superconducting parts cold, and single-cell cavities, the hollow metal structures in which the beam gains energy, to devices that bend a beam with plasma and technologies based on high-temperature superconductors. He added that some of the technologies could completely change the way accelerator laboratories around Europe operate if they are successful, and he gave as examples the ones related to laser-driven acceleration and the lightweight laser mirror of silicon carbide. The article about the launch repeats the remark without naming them.</p>
<h2 class="wp-block-heading">Companies inside the project</h2>
<p class="wp-block-paragraph">Sixteen of the 42 partners are deep-tech companies. Torims said in the interview that there is an industry partner in each work package and that industry will manage some of the results, among them a new production line. The Structure page of the project website names at least one company in each of the nine technical work packages and in one of the other three. <a href="#sixteen-companies-take-part-in-epita">A separate article looks at the companies</a>, and <a href="#permanent-magnets-work-package">the article on permanent magnets</a> follows one case in detail.</p>
<h2 class="wp-block-heading">Where the priorities come from</h2>
<p class="wp-block-paragraph">EPITA follows two European roadmaps. One is the European Strategy for Particle Physics, which the article about the launch calls one of the main references of the project. The other is the 2025 technology roadmap of LEAPS, the League of European Accelerator-based Photon Sources. Its members are light sources, particle accelerators built to produce intense light for the study of materials and living matter.</p>
<p class="wp-block-paragraph">The interview that Torims gave in March still named the 2020 update of the Strategy as the reference. The CERN Council agreed a new update on 22 May 2026, nine days after the launch meeting ended. It recommends FCC-ee, a proposed collider of electrons and positrons, as the preferred option for the next flagship project at CERN. A news post on the project website, signed by Thomas Brent, sets the work packages of EPITA against the recommendations. It links work packages 4, 6, 10, 11 and 12 to recommendation B, on advanced radiofrequency structures and efficient power sources, work packages 4, 6 and 10 to recommendation C, on linear accelerators that recover energy, and work package 5 to recommendation D, on high-gradient wakefield acceleration.</p>
<p class="wp-block-paragraph">The website states the purpose of all this in one sentence. The project is to develop technologies that improve the performance and the sustainability of particle accelerators and facilities, in close cooperation with industry.</p>
<h2 class="wp-block-heading">Beyond the laboratories</h2>
<p class="wp-block-paragraph">Three parts of the project look outside the accelerator community. One task will ask medical doctors what they need from accelerator technology designed for medicine, which Torims described as a first. Another will work on <a href="#common-method-sustainability-research-facilities">shared definitions for assessing the environmental impact of research facilities</a>. Two ten-day programmes will also bring <a href="#students-new-uses-for-accelerators">students together to propose new uses for accelerators</a>.</p>
<p class="wp-block-paragraph">All of this is divided into twelve work packages. <a href="#who-leads-the-twelve-work-packages">A separate article shows them and the people who lead them</a>.</p>
<div class="wp-block-group is-style-note is-layout-flow wp-block-group-is-layout-flow">
<p class="fb-eyebrow wp-block-paragraph">About the figures</p>
<p class="wp-block-paragraph">The public sources do not agree on the size of the consortium. The project website and the article about the launch give 42 partners, and the website adds 15 countries and 16 deep-tech companies. The interview published in March 2026 and the summary of the project in the CORDIS record of the European Commission speak of 43 beneficiaries from 16 countries, and the interview counts 17 industry partners. The list of participants in the same CORDIS record names CERN and 41 others. Under a separate heading it adds three partners that do not sign the grant agreement and receive no European funding, the Helmholtz-Zentrum Dresden-Rossendorf in Germany, Lancaster University in the United Kingdom and the University of Twente in the Netherlands.</p>
<p class="wp-block-paragraph">I have used the figures from the project website. The dates come from the CORDIS record, which gives 30 April 2030 as the last day, while the project website says the project runs until June 2030.</p>
<p class="wp-block-paragraph">The budget needs the same care. The fact sheet in CORDIS shows only the contribution of the European Union, €9,999,999.75, and gives the same amount as the total cost. The €11 million of matching funds appears in the summary text of that record, which speaks of a total budget of more than €21 million, and on the project website. The article about the launch says that the partners provide it.</p>
<p class="wp-block-paragraph">The news post about the Strategy carries no date and says that the update was agreed on 22 May of this year. The year comes from the news item that CERN published on that day.</p>
<p class="wp-block-paragraph">The short explanations of what each part of an accelerator does are mine and not the project’s.</p>
</div>

<article class="wp-block-group is-layout-flow wp-block-group-is-layout-flow">
<div class="wp-block-group fb-article-head has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<div class="wp-block-group is-layout-flow wp-block-group-is-layout-flow"><h1 class="wp-block-post-title">Who leads the twelve work packages of EPITA</h1>
<div class="wp-block-post-excerpt"><p class="wp-block-post-excerpt__excerpt">The project divides its work into twelve packages in four groups. Each one has one or two leaders, and only one of the lead organisations is a company. </p></div>
<div class="wp-block-group fb-meta is-layout-flex wp-block-group-is-layout-flex"><div class="taxonomy-category wp-block-post-terms"><a href="#category-project" rel="tag">Project</a></div>
<div class="wp-block-post-author-name">Michael Cebral</div>
<div class="wp-block-post-date"><time datetime="2026-11-12T11:00:00+01:00">12 November 2026</time></div>
<p class="wp-block-paragraph">6 min read</p>
</div>
</div>
</div>
<div class="wp-block-group fb-article-figure has-global-padding is-layout-constrained wp-block-group-is-layout-constrained">
<div class="wp-block-group alignwide is-layout-flow wp-block-group-is-layout-flow"><figure class="is-wide wp-block-post-featured-image"><img alt="Aerial photograph of the farmland and villages between the Jura and Lake Geneva, with the Alps on the horizon. A yellow line marks the ring of the Large Hadron Collider and labels mark its four large experiments" class="attachment-post-thumbnail size-post-thumbnail wp-post-image" decoding="async" fetchpriority="high" height="1440" loading="eager" sizes="(max-width: 1280px) 100vw, 1200px" src="/newsroom/uploads/cern-aerial.jpg" srcset="/newsroom/uploads/cern-aerial.jpg 1920w, /newsroom/uploads/cern-aerial-300x225.jpg 300w, /newsroom/uploads/cern-aerial-1024x768.jpg 1024w, /newsroom/uploads/cern-aerial-768x576.jpg 768w, /newsroom/uploads/cern-aerial-1536x1152.jpg 1536w" style="object-fit:cover;" width="1920"/></figure>
<p class="fb-credit wp-block-paragraph">The CERN area seen from the air, with the ring of the LHC marked. CERN coordinates EPITA and hosted its launch meeting. Photograph by Maximilien Brice for CERN, CC BY-SA 3.0.</p>
</div>
</div>
<div class="entry-content wp-block-post-content has-global-padding is-layout-constrained wp-block-post-content-is-layout-constrained">
<p class="wp-block-paragraph">With 42 partners in 15 countries, EPITA has to make clear who is responsible for each part of the work. It does so with twelve work packages, each with one or two leaders and a group of partner organisations.</p>
<p class="wp-block-paragraph">The Structure page of the project website lists them all, down to the tasks inside each one. The chart below shows the leaders in the same four groups that the website uses, and the text after it says what each work package is trying to achieve.</p>
<p class="wp-block-paragraph">Several of the organisations are better known by their initials. UKRI is UK Research and Innovation, the public research agency of the United Kingdom. CEA and CNRS are French research organisations, DESY and HZB are German laboratories, INFN is the Italian institute for nuclear physics and PSI is the Paul Scherrer Institute in Switzerland.</p>
<figure class="wp-block-image size-full fb-figure"><picture><source height="1171" media="(max-width: 899px)" srcset="/newsroom/assets/graphics/work-packages-mobile.svg" width="425"><img alt="Chart of the twelve work packages of EPITA in four groups of three. The groups are strategic instruments, accelerating systems, magnets and beamlines, and frontier technologies. Each work package appears with its number, its title and its leader or leaders with their organisation. Work package 7, permanent magnets, is marked in copper as the only one led by a company, Kyma. The text of the article names them all." decoding="async" height="733" src="/newsroom/assets/graphics/work-packages.svg" width="1104"/></source></picture><figcaption class="wp-element-caption">The twelve work packages of EPITA by area, with the people who lead them. Data from the Structure page of the EPITA project website. Graphic by Michael Cebral.</figcaption></figure>
<h2 class="wp-block-heading">Strategic instruments</h2>
<p class="wp-block-paragraph">This is the name the website gives to the first three work packages. They cover the management of the project, its communication and its relationship with industry.</p>
<p class="wp-block-paragraph">Toms Torims of CERN leads work package 1 and coordinates the whole project, with the support of a deputy from the University of Oxford. The task of this work package is the management itself, which its page sums up as coordination, internal communication, financial compliance, risk management and quality assurance.</p>
<p class="wp-block-paragraph">Work package 2, led by Philip Burrows of the University of Oxford, is in charge of communication, with the project website as the main source of information and the newsletter Accelerating News as one of its channels. Burrows writes on the work package page that “Communication is the life-blood of the EPITA project”. According to the same page, a Project Communication Officer will be fully embedded in the management team. The same work package includes <a href="#students-new-uses-for-accelerators">the innovation programmes for students</a> and <a href="#common-method-sustainability-research-facilities">a task on sustainability</a>.</p>
<p class="wp-block-paragraph">Work package 3, led by Carsten Welsch of the University of Liverpool, is meant to carry research results into industry. It supports the industry forum AIPF, which EPITA now funds, and has a task that will ask clinicians and medical physicists what they need from accelerators. <a href="#sixteen-companies-take-part-in-epita">The article about the companies</a> describes it.</p>
<h2 class="wp-block-heading">Accelerating systems</h2>
<p class="wp-block-paragraph">The first technical area deals with the parts that give energy to the particles. Today that job is done by radiofrequency cavities, where an oscillating electric field pushes the particles forward.</p>
<p class="wp-block-paragraph">Work package 4, led by Oleg Malyshev of UKRI and Thomas Proslier of CEA, develops cavities that are coated with a thin film of superconductor and cooled by compact cryocoolers. Proslier presents it as a way to use less critical material and less energy.</p>
<p class="wp-block-paragraph">Work package 5, led by Andreas Maier of DESY, works on laser-driven acceleration. Its aim is to improve compact accelerators with a laser that tunes itself, a curved capillary that bends the beam with plasma and a dielectric structure where the laser travels along with the beam.</p>
<p class="wp-block-paragraph">Work package 6, led by Adolfo Velez of HZB, develops the equipment that powers and tunes the cavities. It will build improved magnetrons, which are a kind of radiofrequency power source. It will also build fast tuners that compensate for the load a beam places on a cavity, and wider tapes of high-temperature superconductor.</p>
<h2 class="wp-block-heading">Magnets and beamlines</h2>
<p class="wp-block-paragraph">The second area covers what creates and guides the beam.</p>
<p class="wp-block-paragraph">Work package 7 is about <a href="#permanent-magnets-work-package">permanent magnets</a>, which hold their field without current, and it aims to turn a tunable one into an industrial product. Raffaella Geometrante of Kyma leads it, and it is the only work package whose lead organisation is a company.</p>
<p class="wp-block-paragraph">Work package 8, led by Ernesto De Matteis of INFN, works with high-temperature superconductors, materials that stay superconducting at higher temperatures than the ones in the LHC magnets. It aims to build magnets that are more compact and use less energy, with cooling systems that do without liquid helium. Two of its tasks are designed for 20 kelvin, which is about 253 degrees below zero on the Celsius scale.</p>
<p class="wp-block-paragraph">Work package 9, led by Paolo Craievich and Thomas Lucas of PSI, develops electron injectors, the first section of an accelerator, where the beam is created. It will design, build and test two radiofrequency components for high-brightness injectors. One is a chirping cavity, which prepares a bunch of electrons to be compressed. The other is a transverse deflecting structure, which is used to measure the bunch.</p>
<h2 class="wp-block-heading">Frontier technologies</h2>
<p class="wp-block-paragraph">The last area brings together three ways of making accelerator parts better.</p>
<p class="wp-block-paragraph">Work package 10, led by David Longuevergne of CNRS, studies surface treatments for niobium cavities, because the inner surface of a cavity has a large effect on how well it performs. It aims to produce cavity prototypes with a high quality factor, which means low losses, and a high gradient, which means more energy gained per metre. Longuevergne writes on its page that niobium technology has not yet reached its full potential.</p>
<p class="wp-block-paragraph">Work package 11, led by Andris Ratkus of Riga Technical University and Maurizio Vedani of Politecnico di Milano, uses additive manufacturing, which builds metal parts layer by layer. It will make two accelerator structures in this way and test them with beam, to show that they can perform as well as parts made by conventional methods.</p>
<p class="wp-block-paragraph">Work package 12, led by Federico Carra of CERN, develops materials for the parts that a beam hits, such as absorbers and targets. They have to withstand intense heat and radiation.</p>
<h2 class="wp-block-heading">Who oversees the project</h2>
<p class="wp-block-paragraph">The article that CERN published about the launch names the people who oversee the project. Peter McIntosh chairs the governing board. He comes from the Science and Technology Facilities Council, known as STFC, one of the councils of UKRI.</p>
<p class="wp-block-paragraph">The Scientific and Technological Advisory Committee has three members, Steinar Stapnes of the University of Oslo, Lia Merminga of Fermilab and Tadeusz Lesiak of the Institute of Nuclear Physics of the Polish Academy of Sciences.</p>
<div class="wp-block-group is-style-note is-layout-flow wp-block-group-is-layout-flow">
<p class="fb-eyebrow wp-block-paragraph">About the count and the names</p>
<p class="wp-block-paragraph">The article that CERN published about the launch mentions nine work packages, and the project website lists twelve. The two figures are compatible, because nine is the number of technical work packages and twelve also counts the three strategic instruments.</p>
<p class="wp-block-paragraph">The chart gives the work packages in plain words, so some names differ from the official titles on the Structure page. The official title of work package 3 is Reinforcing Co-Creation with Industry.</p>
<p class="wp-block-paragraph">The aims of each work package come from its own page on the project website. The short explanations of the technologies are mine.</p>
<p class="wp-block-paragraph">The website gives the two leaders of work packages 4 and 11 and their two organisations in the same order, and I have paired them in that order.</p>
</div>

</li><li class="wp-block-post post-351 post type-post status-publish format-standard has-post-thumbnail hentry category-sustainability">
<figure class="wp-block-post-featured-image"><a aria-hidden="true" href="#common-method-sustainability-research-facilities" tabindex="-1" target="_self"><img alt="" class="attachment-post-thumbnail size-post-thumbnail wp-post-image" decoding="async" height="1600" loading="lazy" sizes="auto, (max-width: 699px) 100vw, 600px" src="/newsroom/uploads/hl-lhc-tunnel.jpg" srcset="/newsroom/uploads/hl-lhc-tunnel.jpg 2400w, /newsroom/uploads/hl-lhc-tunnel-300x200.jpg 300w, /newsroom/uploads/hl-lhc-tunnel-1024x683.jpg 1024w, /newsroom/uploads/hl-lhc-tunnel-768x512.jpg 768w, /newsroom/uploads/hl-lhc-tunnel-1536x1024.jpg 1536w, /newsroom/uploads/hl-lhc-tunnel-2048x1365.jpg 2048w" style="object-fit:cover;" width="2400"/></a></figure>
